<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI 造数平台原型</title>
    <link rel="stylesheet" href="vendor/antd-reset.css" />
    <script src="vendor/react.production.min.js"></script>
    <script src="vendor/react-dom.production.min.js"></script>
    <script src="vendor/dayjs.min.js"></script>
    <script src="vendor/antd.min.js"></script>
    <style>
      :root {
        --bg: #f4f6f9;
        --surface: #ffffff;
        --surface-soft: #f8fafc;
        --line: #d8e0ea;
        --ink: #172033;
        --muted: #64748b;
        --blue: #1677ff;
        --teal: #08979c;
        --green: #389e0d;
        --gold: #d48806;
        --red: #cf1322;
        --sidebar: #172033;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family:
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          "PingFang SC",
          "Microsoft YaHei",
          sans-serif;
      }

      .shell {
        min-height: 100vh;
        display: grid;
        grid-template-columns: 260px minmax(0, 1fr);
      }

      .sidebar {
        background: var(--sidebar);
        color: #f8fafc;
        padding: 20px 16px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .brand {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 4px 4px 16px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      }

      .brand-mark {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: #1677ff;
        display: grid;
        place-items: center;
        font-weight: 800;
      }

      .brand-name {
        font-size: 16px;
        font-weight: 700;
      }

      .brand-sub {
        color: #aab7ca;
        font-size: 12px;
        margin-top: 2px;
      }

      .nav-group {
        display: grid;
        gap: 6px;
      }

      .nav-caption {
        color: #91a4bb;
        font-size: 12px;
        padding: 8px 8px 2px;
      }

      .nav-item {
        min-height: 42px;
        border-radius: 8px;
        padding: 8px 10px;
        display: grid;
        grid-template-columns: 34px minmax(0, 1fr);
        gap: 8px;
        align-items: center;
        color: #cbd5e1;
        cursor: pointer;
      }

      .nav-item.active {
        background: rgba(22, 119, 255, 0.2);
        color: #ffffff;
      }

      .nav-icon {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        display: grid;
        place-items: center;
        background: rgba(255, 255, 255, 0.08);
        font-size: 12px;
        font-weight: 700;
      }

      .nav-title {
        font-size: 14px;
        font-weight: 700;
      }

      .nav-desc {
        color: #9fb0c5;
        font-size: 12px;
        margin-top: 2px;
      }

      .main {
        min-width: 0;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        min-height: 68px;
        background: var(--surface);
        border-bottom: 1px solid var(--line);
        padding: 12px 24px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
      }

      .page-title {
        margin: 0;
        font-size: 20px;
        font-weight: 760;
      }

      .page-subtitle {
        margin-top: 3px;
        color: var(--muted);
        font-size: 12px;
      }

      .page {
        padding: 18px;
        display: grid;
        gap: 16px;
      }

      .grid-2 {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .grid-3 {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
      }

      .grid-4 {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      .layout-3 {
        display: grid;
        grid-template-columns: 320px minmax(0, 1fr) 360px;
        gap: 16px;
      }

      .panel {
        min-width: 0;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        display: flex;
        flex-direction: column;
      }

      .panel-head {
        min-height: 56px;
        padding: 14px 16px;
        border-bottom: 1px solid #edf1f6;
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .panel-title {
        font-size: 15px;
        font-weight: 760;
      }

      .panel-subtitle {
        color: var(--muted);
        font-size: 12px;
        margin-top: 3px;
      }

      .panel-body {
        padding: 16px;
        min-height: 0;
      }

      .hero {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 18px;
        display: grid;
        grid-template-columns: minmax(0, 1.6fr) minmax(280px, 0.8fr);
        gap: 16px;
        align-items: stretch;
      }

      .hero h2 {
        margin: 0 0 8px;
        font-size: 24px;
        line-height: 1.25;
        font-weight: 820;
      }

      .hero-copy {
        color: var(--muted);
        line-height: 1.7;
        max-width: 760px;
      }

      .role-strip {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
        margin-top: 18px;
      }

      .role-card {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 12px;
        background: #fbfcff;
        cursor: pointer;
        min-height: 118px;
      }

      .role-card.active {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.09);
        background: #f3f8ff;
      }

      .role-name {
        font-size: 14px;
        font-weight: 760;
        margin-bottom: 8px;
      }

      .role-question {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
      }

      .score-card {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 16px;
        background: #fbfcff;
        display: grid;
        gap: 12px;
      }

      .score-value {
        font-size: 42px;
        line-height: 1;
        font-weight: 820;
      }

      .score-row {
        display: flex;
        justify-content: space-between;
        gap: 10px;
        color: var(--muted);
        font-size: 12px;
      }

      .metric {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 13px 14px;
        background: #fbfcff;
        min-height: 94px;
      }

      .metric-label {
        color: var(--muted);
        font-size: 12px;
        margin-bottom: 7px;
      }

      .metric-value {
        font-size: 24px;
        font-weight: 820;
        line-height: 1.1;
      }

      .metric-hint {
        color: var(--muted);
        font-size: 12px;
        margin-top: 7px;
        overflow-wrap: anywhere;
      }

      .section-list {
        display: grid;
        gap: 10px;
      }

      .item-card {
        border: 1px solid #e3eaf2;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
        min-width: 0;
      }

      .item-card.clickable {
        cursor: pointer;
      }

      .item-card.active {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(22, 119, 255, 0.09);
      }

      .item-title {
        font-size: 14px;
        font-weight: 760;
        overflow-wrap: anywhere;
      }

      .item-subtitle {
        color: var(--muted);
        font-size: 12px;
        line-height: 1.55;
        margin-top: 5px;
        overflow-wrap: anywhere;
      }

      .tag-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 9px;
      }

      .bar-row {
        display: grid;
        grid-template-columns: 128px minmax(0, 1fr) 54px;
        gap: 10px;
        align-items: center;
        font-size: 12px;
      }

      .bar-label {
        color: var(--muted);
        overflow: hidden;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .bar-track {
        height: 8px;
        border-radius: 99px;
        overflow: hidden;
        background: #e9eef6;
      }

      .bar-fill {
        height: 100%;
        background: var(--blue);
      }

      .bar-value {
        text-align: right;
        font-weight: 760;
      }

      .matrix-row {
        display: grid;
        grid-template-columns: 160px repeat(4, minmax(0, 1fr));
        gap: 10px;
        align-items: center;
        border-bottom: 1px solid #edf1f6;
        padding: 10px 0;
      }

      .matrix-row:last-child {
        border-bottom: 0;
      }

      .matrix-head {
        color: var(--muted);
        font-size: 12px;
        font-weight: 700;
      }

      .matrix-cell {
        min-width: 0;
        font-size: 12px;
      }

      .workbench {
        display: grid;
        grid-template-columns: 340px minmax(0, 1fr) 360px;
        gap: 16px;
      }

      .intent-box {
        display: grid;
        gap: 12px;
      }

      .param-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .step-card {
        border: 1px solid #e3eaf2;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
      }

      .step-top {
        display: flex;
        justify-content: space-between;
        align-items: flex-start;
        gap: 10px;
      }

      .step-name {
        font-size: 14px;
        font-weight: 760;
      }

      .step-api {
        color: var(--muted);
        font-size: 12px;
        margin-top: 4px;
        font-family: Consolas, "SFMono-Regular", monospace;
        overflow-wrap: anywhere;
      }

      .log-row {
        border-bottom: 1px solid #edf1f6;
        padding: 12px 16px;
        cursor: pointer;
      }

      .log-row:hover,
      .log-row.active {
        background: #f3f8ff;
      }

      .log-top {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-bottom: 5px;
      }

      .log-title {
        font-size: 13px;
        font-weight: 760;
      }

      .log-desc {
        color: var(--muted);
        font-size: 12px;
      }

      .detail-block {
        margin: 0;
        background: #111827;
        color: #dbeafe;
        border-radius: 8px;
        padding: 12px;
        overflow: auto;
        font-size: 12px;
        line-height: 1.55;
        max-height: 300px;
      }

      .arch-map {
        display: grid;
        grid-template-columns: repeat(7, minmax(98px, 1fr));
        gap: 8px;
        align-items: stretch;
      }

      .arch-node {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 12px 8px;
        min-height: 92px;
        background: #fbfcff;
        display: grid;
        align-content: center;
        text-align: center;
      }

      .arch-arrow {
        display: grid;
        place-items: center;
        color: var(--muted);
        font-weight: 800;
      }

      .pipeline {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 10px;
      }

      .pipeline-step {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 12px;
        background: #fbfcff;
        min-height: 116px;
      }

      .pipeline-index {
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: #e6f4ff;
        color: #0958d9;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 10px;
      }

      .drill-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.15fr) minmax(320px, 0.85fr);
        gap: 16px;
      }

      .coverage-map {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .coverage-card {
        border: 1px solid #dfe7f1;
        border-left: 4px solid #d9d9d9;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
        min-height: 128px;
      }

      .coverage-card.covered {
        border-left-color: var(--green);
        background: #f6ffed;
      }

      .coverage-card.candidate {
        border-left-color: var(--gold);
        background: #fffbe6;
      }

      .coverage-card.gap {
        border-left-color: var(--red);
        background: #fff7f6;
      }

      .state-flow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .state-chip {
        min-height: 40px;
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 8px 10px;
        background: #fbfcff;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .state-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--blue);
      }

      .slot-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .slot-card {
        border: 1px solid #e3eaf2;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
      }

      .slot-key {
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 12px;
        font-weight: 760;
      }

      .dag {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .dag-node {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 12px;
        background: #fbfcff;
        min-height: 106px;
        position: relative;
      }

      .dag-node::after {
        content: "→";
        position: absolute;
        top: 12px;
        right: 10px;
        color: #94a3b8;
        font-weight: 800;
      }

      .dag-node:last-child::after {
        content: "";
      }

      .rule-list {
        display: grid;
        gap: 8px;
      }

      .rule-item {
        display: grid;
        grid-template-columns: 24px minmax(0, 1fr);
        gap: 8px;
        align-items: start;
        border: 1px solid #e3eaf2;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
      }

      .rule-mark {
        width: 20px;
        height: 20px;
        border-radius: 7px;
        background: #e6f4ff;
        color: #0958d9;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
      }

      .policy-grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .policy-card {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
        min-height: 150px;
      }

      .config-row {
        display: grid;
        grid-template-columns: 150px minmax(0, 1fr) 110px;
        gap: 10px;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #edf1f6;
      }

      .config-row:last-child {
        border-bottom: 0;
      }

      .risk-card {
        border: 1px solid #ffd8bf;
        border-radius: 8px;
        padding: 12px;
        background: #fff7e6;
      }

      .template-preview {
        border: 1px dashed #b7c6d8;
        border-radius: 8px;
        padding: 12px;
        background: #fbfcff;
        font-family: Consolas, "SFMono-Regular", monospace;
        font-size: 12px;
        line-height: 1.6;
        overflow: auto;
      }

      .scan-run {
        display: grid;
        grid-template-columns: 118px minmax(0, 1fr) 86px;
        gap: 10px;
        align-items: center;
        border: 1px solid #e3eaf2;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
      }

      .journey {
        display: grid;
        grid-template-columns: repeat(6, minmax(0, 1fr));
        gap: 10px;
      }

      .journey-step {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 12px;
        background: #fbfcff;
        min-height: 126px;
      }

      .journey-step.active {
        border-color: var(--blue);
        background: #f3f8ff;
      }

      .journey-step.done {
        border-color: #b7eb8f;
        background: #f6ffed;
      }

      .step-index {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        background: #e6f4ff;
        color: #0958d9;
        display: grid;
        place-items: center;
        font-size: 12px;
        font-weight: 800;
        margin-bottom: 10px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .field-card {
        border: 1px solid #e3eaf2;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
      }

      .artifact-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .artifact-card {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 12px;
        background: #ffffff;
        min-height: 120px;
      }

      .e2e-lane {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 12px;
        background: #fbfcff;
      }

      .e2e-flow {
        display: grid;
        grid-template-columns: repeat(5, minmax(0, 1fr));
        gap: 8px;
        margin-top: 10px;
      }

      .e2e-node {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
        min-height: 88px;
      }

      .correction-board {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      .correction-column {
        border: 1px solid #dfe7f1;
        border-radius: 8px;
        background: #fbfcff;
        padding: 10px;
        min-height: 260px;
      }

      .trial-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.1fr) minmax(320px, 0.9fr);
        gap: 16px;
      }

      .trial-step {
        display: grid;
        grid-template-columns: 28px minmax(0, 1fr) 82px;
        gap: 10px;
        align-items: start;
        border: 1px solid #e3eaf2;
        border-radius: 8px;
        padding: 10px;
        background: #ffffff;
      }

      .scroll {
        overflow: auto;
      }

      @media (max-width: 1320px) {
        .layout-3,
        .workbench {
          grid-template-columns: 300px minmax(0, 1fr);
        }

        .layout-3 > .panel:last-child,
        .workbench > .panel:last-child {
          grid-column: 1 / -1;
        }

        .grid-4,
        .role-strip,
        .policy-grid,
        .journey,
        .artifact-grid,
        .correction-board,
        .pipeline {
          grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .arch-map {
          grid-template-columns: repeat(3, minmax(0, 1fr));
        }

        .arch-arrow {
          display: none;
        }
      }

      @media (max-width: 980px) {
        .shell {
          grid-template-columns: 1fr;
        }

        .sidebar {
          display: none;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        .hero,
        .layout-3,
        .workbench,
        .grid-2,
        .grid-3,
        .grid-4,
        .role-strip,
        .drill-grid,
        .coverage-map,
        .slot-grid,
        .dag,
        .policy-grid,
        .config-row,
        .scan-run,
        .journey,
        .form-grid,
        .artifact-grid,
        .e2e-flow,
        .correction-board,
        .trial-grid,
        .trial-step,
        .pipeline {
          grid-template-columns: 1fr;
        }

        .matrix-row {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      const { useEffect, useMemo, useState } = React;
      const {
        Button,
        Collapse,
        ConfigProvider,
        Input,
        InputNumber,
        Progress,
        Select,
        Space,
        Tag,
        Timeline,
        Typography,
        message,
        theme
      } = antd;
      const h = React.createElement;

      const fallbackSystems = [
        { code: "wms", name: "仓储管理系统", type: "business", language: "Go", framework: "Gin", repo: "sample-repos/wms" },
        { code: "oms", name: "订单管理系统", type: "business", language: "Go", framework: "Gin", repo: "sample-repos/oms" },
        { code: "tms", name: "运输管理系统", type: "business", language: "Go", framework: "Gin", repo: "sample-repos/tms" }
      ];

      const fallbackConnectors = [
        { system: "wms", env: "test", baseUrl: "http://127.0.0.1:4101", auth: { type: "none" }, safety: { blacklist: [] } },
        { system: "oms", env: "test", baseUrl: "http://127.0.0.1:4102", auth: { type: "none" }, safety: { blacklist: [] } },
        { system: "tms", env: "test", baseUrl: "http://127.0.0.1:4103", auth: { type: "none" }, safety: { blacklist: [] } }
      ];

      const fallbackScenarios = [
        {
          id: "wms_outbound_allocated",
          name: "出库单造数",
          systems: ["WMS"],
          defaultStage: "ALLOCATED",
          description: "创建 WMS 出库单，并执行到创建、审核、分配库存或出库完成。",
          stages: [
            { value: "CREATED", label: "已创建" },

      function startOfDay(timestamp) {
        const date = new Date(timestamp);
        date.setHours(0, 0, 0, 0);
        return date.getTime();
      }

      function startOfMonth(timestamp) {
        const date = new Date(timestamp);
        date.setDate(1);
        date.setHours(0, 0, 0, 0);
        return date.getTime();
      }

      function summarizeRuns(rows) {
        const latest = rows.reduce((max, row) => Math.max(max, parseDate(row.finishedAt)), 0) || Date.now();
        const todayStart = startOfDay(latest);
        const weekStart = todayStart - 6 * 24 * 60 * 60 * 1000;
        const monthStart = startOfMonth(latest);
        const success = rows.filter((row) => row.status === "success").length;
        const failed = rows.length - success;
        const inRange = (start) => rows.filter((row) => parseDate(row.finishedAt) >= start).length;
        return {
          total: rows.length,
          success,
          failed,
          successRate: rows.length ? Math.round((success / rows.length) * 100) : 0,
          today: inRange(todayStart),
          week: inRange(weekStart),
          month: inRange(monthStart)
        };
      }

            const candidates = candidateList.filter((candidate) =>

            );
            const runs = logList.filter((log) => systemCodesForScene(scenarioList, log.scene).includes(code));
            const summary = summarizeRuns(runs);
            const connector = connectorList.find((item) => String(item.system).toLowerCase() === code);
            const coverage = scenes.length + candidates.length;
            const healthScore = Math.round(summary.successRate * 0.7 + (connector ? 20 : 0) + Math.min(10, scenes.length * 2));
            return { system, code, scenes, candidates, runs, summary, connector, coverage, healthScore: Math.min(100, healthScore) };

          const rows = await api("/api/scenarios");

            const next = mapped.find((item) => item.id === selectScene);
            if (next) {
              setSelectedId(next.id);
              setTargetStage(next.defaultStage);
              setRemoteSteps(null);
            }
          } else if (mapped.length && !mapped.some((item) => item.id === selectedId)) {
            setSelectedId(mapped[0].id);
            setTargetStage(mapped[0].defaultStage);
          }
          return mapped;
        }

          try {
            const rows = await api("/api/logs");
            const mapped = rows.map((row) => ({
              id: row.file,
              scene: row.scene,
              title: row.sceneName,
              status: row.success ? "success" : "failed",
              stage: row.targetStage,
              time: row.finishedAt ? row.finishedAt.slice(11, 19) : "",
              finishedAt: row.finishedAt,
              result: { ...row.context, error: row.error },
              steps: row.success ? ["执行完成", "状态校验通过"] : ["执行失败", row.error || "未知错误"]
            }));
            if (mapped.length) {
              setLogList(mapped);
              await loadLogDetail(mapped[0]);
            }
          } catch {
            setLogList(fallbackLogs);
          }
        }

        async function loadLogDetail(log) {
          if (!log?.id || !String(log.id).endsWith(".json")) {
            setActiveLog(log);
            return;
          }
          try {
            const detail = await api(`/api/logs/${encodeURIComponent(log.id)}`);
            setActiveLog({ ...logFromResult(detail), id: log.id });
          } catch {
            setActiveLog(log);
          }
        }

        async function refreshCandidates(runScan = false) {
          try {
            const data = await api(runScan ? "/api/scan" : "/api/candidates", {
              method: runScan ? "POST" : "GET"
            });
            setCandidateList(data.candidateScenes || []);
            if (runScan) message.success("扫描完成，候选场景已刷新");
          } catch (error) {
            if (runScan) message.error(error.message);
          }
        }

        async function refreshAssets() {
          try {
            const [systems, connectors, status] = await Promise.all([
              api("/api/systems"),
              api("/api/connectors"),
              api("/api/status")
            ]);
            setSystemList(systems.length ? systems : fallbackSystems);
            setConnectorList(connectors.length ? connectors : fallbackConnectors);
            setStatusInfo(status);
            if (systems.length && !systems.some((system) => system.code === selectedSystem)) {
              setSelectedSystem(systems[0].code);
            }
          } catch {
            setSystemList(fallbackSystems);
            setConnectorList(fallbackConnectors);
          }
        }

          await Promise.allSettled([refreshScenarios(), refreshLogs(), refreshCandidates(), refreshAssets()]);
        }

          if (!candidate) return;
          try {
            setLoading(true);
            const confirmed = await api(`/api/candidates/${encodeURIComponent(candidate.scene)}/confirm`, {
              method: "POST"
            });
            await refreshScenarios(confirmed.scene);
            await refreshCandidates(false);
            message.success("候选场景已确认");
          } catch (error) {
            message.error(error.message);
          } finally {
            setLoading(false);
          }

            setRemoteSteps(data.plan);

            setTargetStage(stage);
            setRemoteSteps(null);
            message.success("已生成本地预览");

            setLoading(false);

                  targetStage,
                  params: compactParams(params),
                  rawText: intent

            message.success("执行完成");

            setActivePage("logs");

            message.error(error.message);

            await refreshLogs();
          } finally {
            setLoading(false);

                  h("div", { className: "rule-list", style: { marginTop: 10 } },
                    policy.rules.map((rule, index) =>
                      h("div", { className: "rule-item", key: rule },

              )
            ),
            h("div", { className: "grid-2" },
              h("div", { className: "panel" },
                h("div", { className: "panel-head" },
                  h("div", null,
                    h("div", { className: "panel-title" }, "环境执行矩阵"),
                    h("div", { className: "panel-subtitle" }, "决定 agent 可以在哪些环境做什么")
                  ),
                  h(Tag, { color: "blue" }, `${environmentPolicies.length} 个环境`)
                ),
                h("div", { className: "panel-body" },
                  environmentPolicies.map((env) =>
                    h("div", { className: "config-row", key: env.env },
                      h("div", null,
                        h("div", { className: "item-title" }, env.env.toUpperCase()),
                        h("div", { className: "item-subtitle" }, env.scope)
                      ),
                      h("div", { className: "tag-row", style: { marginTop: 0 } },
                        h(Tag, { color: env.execution === "允许" ? "success" : env.execution === "受限" ? "warning" : "error" }, env.execution),
                        h(Tag, null, env.approval),
                        h(Tag, null, `保留 ${env.retention}`)
                      ),
                      h(Button, { size: "small" }, "配置")
                    )
                  )
                )
              ),
              h("div", { className: "panel" },
                h("div", { className: "panel-head" },
                  h("div", null,
                    h("div", { className: "panel-title" }, "连接器安全"),
                    h("div", { className: "panel-subtitle" }, "系统接入后必须显式配置安全边界")
                  ),
                  h(Tag, null, `${connectorList.length} 个连接器`)
                ),
                h("div", { className: "panel-body section-list" },
                  connectorList.map((connector) =>
                    h("div", { className: "item-card", key: `${connector.system}-${connector.env}` },
                      h("div", { className: "item-title" }, `${String(connector.system).toUpperCase()} · ${connector.env}`),
                      h("div", { className: "item-subtitle" }, connector.baseUrl),
                      h("div", { className: "tag-row" },
                        h(Tag, { color: "blue" }, `auth ${connector.auth?.type || "unknown"}`),
                        h(Tag, { color: connector.safety?.blacklist?.length ? "orange" : "green" }, `blacklist ${connector.safety?.blacklist?.length || 0}`),
                        h(Tag, { color: "purple" }, "审计开启")
                      )
                    )
                  )
                )
              )
            ),
            h("div", { className: "grid-2" },
              h("div", { className: "panel" },
                h("div", { className: "panel-head" },
                  h("div", null,
                    h("div", { className: "panel-title" }, "参数模板"),
                    h("div", { className: "panel-subtitle" }, "让使用者少填参数，agent 可自动补齐")
                  ),
                  h(Button, { size: "small", onClick: () => setActivePage("workspace") }, "去造数")
                ),
                h("div", { className: "panel-body section-list" },
                  parameterTemplates.map((template) =>
                    h("div", { className: "item-card", key: template.id },
                      h("div", { className: "item-title" }, template.name),
                      h("div", { className: "tag-row" },
                        template.systems.map((system) => h(Tag, { key: system, color: systemTagColor(system) }, system)),
                        h(Tag, null, `${template.fields.length} 个字段`)
                      ),
                      h("pre", { className: "template-preview", style: { marginTop: 10 } }, JSON.stringify(template.defaults, null, 2))
                    )
                  )
                )
              ),
              h("div", { className: "panel" },
                h("div", { className: "panel-head" },
                  h("div", null,
                    h("div", { className: "panel-title" }, "风险待办"),
                    h("div", { className: "panel-subtitle" }, "阻止平台扩大使用范围的问题")
                  ),
                  h(Tag, { color: "orange" }, `${riskBacklog.length} 项`)
                ),
                h("div", { className: "panel-body section-list" },
                  riskBacklog.map((risk) =>
                    h("div", { className: "risk-card", key: risk.title },
                      h("div", { className: "tag-row", style: { marginTop: 0 } },
                        h(Tag, { color: risk.level === "P0" ? "red" : "orange" }, risk.level),
                        h(Tag, null, risk.owner)
                      ),
                      h("div", { className: "item-title", style: { marginTop: 8 } }, risk.title),
                      h("div", { className: "item-subtitle" }, risk.action)
                    )
                  )
                )
              )
            )
          );
        }

        function renderOnboardingPage() {
          const activeScene = e2eGeneratedScenes[0];
          return h("section", { className: "page" },
            h("div", { className: "panel" },
              h("div", { className: "panel-head" },
                h("div", null,
                  h("div", { className: "panel-title" }, "新业务系统接入主流程"),
                  h("div", { className: "panel-subtitle" }, "从系统注册、代码分析、E2E 场景生成，到人工校正和试运行")
                ),
                h(Space, null,
                  h(Button, { onClick: () => setActivePage("governance") }, "配置治理"),
                  h(Button, { type: "primary", onClick: () => setActivePage("workspace") }, "进入工作台")
                )
              ),
              h("div", { className: "panel-body" },
                h("div", { className: "journey" },
                  onboardingJourney.map((step, index) =>
                    h("div", { className: `journey-step ${step.status}`, key: step.key },
                      h("div", { className: "step-index" }, index + 1),
                      h("div", { className: "item-title" }, step.name),
                      h("div", { className: "item-subtitle" }, step.desc),
                      h("div", { className: "tag-row" },
                        h(Tag, { color: step.status === "done" ? "success" : step.status === "active" ? "blue" : "default" },
                          step.status === "done" ? "已完成" : step.status === "active" ? "进行中" : "待处理"
                        )
                      )
                    )
                  )
                )
              )
            ),
            h("div", { className: "grid-2" },
              h("div", { className: "panel" },
                h("div", { className: "panel-head" },
                  h("div", null,
                    h("div", { className: "panel-title" }, "1. 注册业务系统"),
                    h("div", { className: "panel-subtitle" }, "登记系统身份、代码仓、测试环境和安全边界")
                  ),
                  h(Tag, { color: "blue" }, newSystemDraft.code.toUpperCase())
                ),
                h("div", { className: "panel-body" },
                  h("div", { className: "form-grid" },
                    Object.entries({
                      "系统编码": newSystemDraft.code,
                      "系统名称": newSystemDraft.name,
                      "负责人": newSystemDraft.owner,
                      "代码仓": newSystemDraft.repo,
                      "分支": newSystemDraft.branch,
                      "后端技术": `${newSystemDraft.language} · ${newSystemDraft.framework}`,
                      "前端/App": `${newSystemDraft.frontend} / ${newSystemDraft.app}`,
                      "测试环境": newSystemDraft.baseUrl,
                      "认证方式": newSystemDraft.auth,
                      "目标环境": newSystemDraft.env
                    }).map(([label, value]) =>
                      h("div", { className: "field-card", key: label },
                        h("div", { className: "metric-label" }, label),
                        h("div", { className: "item-title" }, value)
                      )
                    )
                  )
                )
              ),
              h("div", { className: "panel" },
                h("div", { className: "panel-head" },
                  h("div", null,
                    h("div", { className: "panel-title" }, "2. 代码分析产物"),
                    h("div", { className: "panel-subtitle" }, "扫描接口、实体、状态机和跨系统依赖")
                  ),
                  h(Button, { size: "small", onClick: () => setActivePage("capability") }, "看扫描能力")
                ),
                h("div", { className: "panel-body artifact-grid" },
                  codeAnalysisArtifacts.map((artifact) =>
                    h("div", { className: "artifact-card", key: artifact.name },
                      h("div", { className: "metric-label" }, artifact.name),
                      h("div", { className: "metric-value", style: { color: "#0958d9" } }, artifact.value),
                      h("div", { className: "item-subtitle" }, artifact.desc)
                    )
                  )
                )
              )
            ),
            h("div", { className: "panel" },
              h("div", { className: "panel-head" },
                h("div", null,
                  h("div", { className: "panel-title" }, "3. 自动生成 E2E 候选场景"),
                  h("div", { className: "panel-subtitle" }, "从接口、状态机和跨系统依赖推导端到端业务路径")
                ),
                h(Tag, { color: "purple" }, `${e2eGeneratedScenes.length} 个候选`)
              ),
              h("div", { className: "panel-body section-list" },
                e2eGeneratedScenes.map((scene) =>
                  h("div", { className: "e2e-lane", key: scene.id },
                    h("div", { className: "tag-row", style: { marginTop: 0 } },
                      h(Tag, { color: scene.confidence >= 85 ? "success" : "warning" }, `置信度 ${scene.confidence}%`),
                      h(Tag, { color: "blue" }, scene.target),
                      scene.systems.map((system) => h(Tag, { key: system, color: systemTagColor(system) }, system))
                    ),
                    h("div", { className: "item-title", style: { marginTop: 8 } }, scene.name),
                    h("div", { className: "e2e-flow" },
                      scene.flow.map((node, index) =>
                        h("div", { className: "e2e-node", key: `${scene.id}-${node}` },
                          h("div", { className: "step-index", style: { marginBottom: 8 } }, index + 1),
                          h("div", { className: "item-title" }, node),
                          h("div", { className: "item-subtitle" }, scene.evidence[index] || "待补证据")
                        )
                      )
                    )
                  )
                )
              )
            ),
            h("div", { className: "grid-2" },
              h("div", { className: "panel" },
                h("div", { className: "panel-head" },
                  h("div", null,
                    h("div", { className: "panel-title" }, "4. 场景校正操作流"),
                    h("div", { className: "panel-subtitle" }, "候选场景进入正式库前要完成的人工确认")
                  ),
                  h(Tag, { color: "blue" }, activeScene.name)
                ),
                h("div", { className: "panel-body correction-board" },
                  correctionTasks.map((column) =>
                    h("div", { className: "correction-column", key: column.column },
                      h("div", { className: "item-title" }, column.column),
                      h("div", { className: "section-list", style: { marginTop: 10 } },
                        column.tasks.map((task, index) =>
                          h("div", { className: "rule-item", key: task },
                            h("div", { className: "rule-mark" }, index + 1),
                            h("div", { className: "item-subtitle", style: { marginTop: 1 } }, task)
                          )
                        )
                      )
                    )
                  )
                )
              ),
              h("div", { className: "panel" },
                h("div", { className: "panel-head" },
                  h("div", null,
                    h("div", { className: "panel-title" }, "5. 试运行和发布"),
                    h("div", { className: "panel-subtitle" }, "先 dry-run，再单步执行，最后发布到正式场景库")
                  ),
                  h(Button, { size: "small", onClick: () => setActivePage("logs") }, "看日志")
                ),
                h("div", { className: "panel-body section-list" },
                  trialRunPlan.map((step, index) =>
                    h("div", { className: "trial-step", key: step.step },
                      h("div", { className: "rule-mark" }, index + 1),
                      h("div", null,
                        h("div", { className: "item-title" }, step.step),
                        h("div", { className: "item-subtitle" }, step.detail)
                      ),
                      h(Tag, {
                        color: step.status === "passed" ? "success" : step.status === "running" ? "processing" : "default"
                      }, step.status === "passed" ? "通过" : step.status === "running" ? "执行中" : "待执行")
                    )
                  ),
                  h("div", { className: "item-card" },
                    h("div", { className: "item-title" }, "发布条件"),
                    h("div", { className: "item-subtitle" }, "试运行成功、校验点齐全、治理策略通过、Owner 确认后，进入正式场景库供自然语言调用。")
                  )
                )
              )
            )
          );
        }

        function renderLogsPage() {
          return h("section", { className: "page layout-3" },
            h("div", { className: "panel" },
              h("div", { className: "panel-head" },
                h("div", null,
                  h("div", { className: "panel-title" }, "执行记录"),
                  h("div", { className: "panel-subtitle" }, "最近 50 次")
                ),
                h(Button, { size: "small", onClick: refreshLogs, loading }, "刷新")
              ),
              h("div", { className: "scroll", style: { maxHeight: 720 } },
                logList.map((log) =>
                  h("div", {
                    className: `log-row ${activeLog?.id === log.id ? "active" : ""}`,
                    key: log.id,
                    onClick: () => loadLogDetail(log)
                  },
                    h("div", { className: "log-top" },
                      h("div", { className: "log-title" }, log.title),
                      h(Tag, { color: statusColor(log.status) }, log.status)
                    ),
                    h("div", { className: "log-desc" }, `${log.time} · ${log.stage}`)
                  )
                )
              )
            ),
            h("div", { className: "panel" },
              h("div", { className: "panel-head" },
                h("div", null,
                  h("div", { className: "panel-title" }, "步骤链路"),
                  h("div", { className: "panel-subtitle" }, activeLog?.title || "-")
                ),
                h(Space, null,
                  h(Button, { size: "small", onClick: rerunActive, loading }, "重跑"),
                  h(Button, { size: "small", onClick: copyResult }, "复制")
                )
              ),
              h("div", { className: "panel-body" },
                h(Timeline, {
                  items: (activeLog?.steps || []).map((step) => ({
                    color: /失败|FAILED/i.test(step) ? "red" : "blue",
                    children: step
                  }))
                }),
                activeLog?.raw?.logs?.length > 0 && h(Collapse, {
                  size: "small",
                  style: { marginTop: 10 },
                  items: activeLog.raw.logs.map((step, index) => ({
                    key: step.step || String(index),
                    label: `${index + 1}. ${step.name} · ${step.status}`,
                    children: h("pre", { className: "detail-block" }, JSON.stringify({
                      request: step.request,
                      response: step.response,
                      error: step.error,
                      durationMs: step.durationMs
                    }, null, 2))
                  }))
                })
              )
            ),
            h("div", { className: "panel" },
              h("div", { className: "panel-head" }, h("div", { className: "panel-title" }, "结果上下文")),
              h("div", { className: "panel-body" },
                h("pre", { className: "detail-block" }, JSON.stringify(activeLog?.raw || activeLog?.result || {}, null, 2))
              )
            )
          );
        }

        function renderActivePage() {
          if (activePage === "systems") return renderSystemsPage();
          if (activePage === "workspace") return renderWorkspacePage();
          if (activePage === "onboarding") return renderOnboardingPage();
          if (activePage === "capability") return renderCapabilityPage();
          if (activePage === "governance") return renderGovernancePage();
          if (activePage === "logs") return renderLogsPage();
          return renderValuePage();
        }

        return h(ConfigProvider, {
          theme: {
            algorithm: theme.defaultAlgorithm,
            token: {
              colorPrimary: "#1677ff",
              borderRadius: 8,
              fontSize: 14
            }
          }
        },
          h("div", { className: "shell" },
            h("aside", { className: "sidebar" },
              h("div", { className: "brand" },
                h("div", { className: "brand-mark" }, "AI"),
                h("div", null,
                  h("div", { className: "brand-name" }, "造数平台"),
                  h("div", { className: "brand-sub" }, "Role View Console")
                )
              ),
              h("div", { className: "nav-group" },
                h("div", { className: "nav-caption" }, "视角"),
                navItems.map((item) =>
                  h("div", {
                    key: item.key,
                    className: `nav-item ${activePage === item.key ? "active" : ""}`,
                    onClick: () => setActivePage(item.key)
                  },
                    h("div", { className: "nav-icon" }, item.icon),
                    h("div", null,
                      h("div", { className: "nav-title" }, item.label),
                      h("div", { className: "nav-desc" }, `${item.role} · ${item.subtitle}`)
                    )
                  )
                )
              )
            ),
            h("main", { className: "main" },
              h("header", { className: "topbar" },
                h("div", null,
                  h("h1", { className: "page-title" }, activeMeta.label),
                  h("div", { className: "page-subtitle" }, `${activeMeta.role} 视角 · ${activeMeta.subtitle}`)
                ),
                h(Space, { wrap: true },
                  h(Tag, { color: statusInfo?.ok ? "success" : "default" }, statusInfo?.ok ? "服务正常" : "原型数据"),
                  h(Tag, { color: "blue" }, `${scenarioList.length} 场景`),
                  h(Button, { onClick: refreshAll, loading }, "刷新"),
                  h(Button, { type: activePage === "onboarding" ? "primary" : "default", onClick: () => setActivePage("onboarding") }, "接入系统"),
                  h(Button, { type: activePage === "workspace" ? "primary" : "default", onClick: () => setActivePage("workspace") }, "开始造数")
                )
              ),
              renderActivePage()
            )
          )
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(h(App));
    </script>
  </body>
</html>
