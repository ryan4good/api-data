location = /bizdevops {
    return 301 /bizdevops/;
}

# This exact match wins over the API prefix below. The named zone is declared
# by nginx-bizdevops-http.conf in the enclosing `http` context.
location = /bizdevops/api/v1/auth/login {
    auth_basic "BizDevOps trial";
    auth_basic_user_file /etc/nginx/.htpasswd-bizdevops;
    limit_req zone=bizdevops_login burst=5 nodelay;

    proxy_pass http://127.0.0.1:18080/api/v1/auth/login;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 16k;
}

location ^~ /bizdevops/api/ {
    auth_basic "BizDevOps trial";
    auth_basic_user_file /etc/nginx/.htpasswd-bizdevops;

    proxy_pass http://127.0.0.1:18080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
    client_max_body_size 2m;
}

location ^~ /bizdevops/ {
    auth_basic "BizDevOps trial";
    auth_basic_user_file /etc/nginx/.htpasswd-bizdevops;

    root /var/www;
    try_files $uri $uri/ /bizdevops/index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy same-origin always;
}
